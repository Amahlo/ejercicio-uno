<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoViajes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-wrap">
    <header class="header-wrap">
        <figure class="logo">
            <h2 class="logo-text">EcoViajes</h2>
        </figure>
        <nav class="nav">
            <a href="#" class="nav-header">Incios</a>
            <a href="#" class="nav-header">Destinos</a>
            <a href="#" class="nav-header">Contacto</a>
        </nav>
    </header>
    <aside class="sidebar">
        <nav class="aside-nav">
            <h2 class="sidebar-text">CATEGORÍAS</h2>
            <a href="#" class="sidebar-link">Playas y Costas</a>
            <a href="#" class="sidebar-link">Montañas</a>
            <a href="#" class="sidebar-link">Selvas y Bosques</a>
            <a href="#" class="sidebar-link">Turismo Urbano</a>
            <a href="#" class="sidebar-link">Ofertas</a>
        </nav>
    </aside>
    <main class="main">
        <section class="section-up">
            <figure class="eco-image-box">
                <img src="src/images/photo-1414235077428-338989a2e8c0.avif" class="eco-image" alt="#">
            </figure>
            <div class="eco-text">
                <h1 class="eco-title">Descubre el Mundo</h1>
                <p class="eco-p">
                    Aventuras innolvidables te esperan a un solo click de distancia.
                </p>
            </div>
        </section>
        <section class="section-down">
            <article class="services-card">
                <img src="" class="service-image" alt="">
                <div class="service-text-box">
                    <h3 class="service-title"></h3>
                    <p class="service-text"></p>
                </div>
            </article>
            <article class="services-card"></article>
                <img src="" class="service-image" alt="">
                <div class="service-text-box">
                    <h3 class="service-title"></h3>
                    <p class="service-text"></p>
                </div>
            <article class="services-card">
                <img src="" class="service-image" alt="">
                <div class="service-text-box">
                    <h3 class="service-title"></h3>
                    <p class="service-text"></p>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
